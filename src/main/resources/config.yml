# YSM client protocol observed in ysm-2.6.5 for Minecraft 1.21.1.
protocol-version: "2.6.0"
channel: "yes_steve_model:2_6_0"

# Send a handshake shortly after join. The delay gives the client mod time to
# finish registering its custom payload receiver.
handshake-delay-ticks: 20
handshake-retries: 2
handshake-retry-interval-ticks: 60

# Debug raw subpacket ids and sizes from the YSM channel. OPs can change this
# online with /ysm debug <on|off>.
debug: false

# Operational logs for Paper-side model scanning and packet distribution.
logging:
  # Writes one log line for every successfully probed .ysm model during startup
  # scans and /ysm models reload.
  model-scan-details: false
  # Writes per-viewer packet send lines plus a hex preview when /ysm apply
  # distributes an entity model-state update.
  packet-details: false
  packet-hex-preview-bytes: 96
  raw-packet-hex-preview-bytes: 128

# Optional local .ysm model reference directory. PaperYSM uses this mostly to
# read animation/profile metadata for wheel actions; native cache sync still
# works without these files. Relative paths are resolved under the plugin data
# folder, usually plugins/PaperYSM/. In the repository test layout this points
# at the Freesia worker's real model folder, not a junction shown to the client.
models-dir: "../../../freesia-worker/config/yes_steve_model/custom"
scan-models-on-enable: true

# Remember the last YSM model/texture each player selected and re-apply it
# after the next compatible YSM handshake. This keeps returning players visible
# as their saved model without requiring them to click the skin/model picker.
state:
  remember-player-models: true
  saved-models-file: "player-models.yml"

# Experimental local .ysm decoding/cache staging. Keep this path for future
# native-cache generation work, but the normal runtime below uses worker/Freesia
# native cache fixtures instead of these Java-generated payloads.
distribution:
  prepare-on-reload: false
  chunk-bytes: 24576
  cache-dir: "cache/distribution"
  # False keeps decrypted payloads in memory only. Enable for packet/native
  # comparisons on a controlled test server.
  write-cache-files: false

# Java-layer sync packets that the original server sends after the 51/52
# handshake. This advertises server-authorized model ids; native/raw cache data
# is still a separate sync path.
sync:
  send-authorized-models-on-handshake: true
  # Warn only when no native cache source is sent after handshake.
  warn-missing-native-sync-on-handshake: true
  # Controlled reverse-engineering aid: replay raw S2C id=1 packet bodies from
  # sync.raw-replay-dir. Replay accepts raw .bin bodies and Freesia debug
  # .log/.txt S2C hex dumps. Command mode "freesia" paces the first two
  # packets around client C2S id=2 replies, matching the Worker bootstrap.
  # Keep this disabled for normal servers.
  enable-raw-replay: false
  raw-replay-dir: "captures/replay"
  raw-replay-interval-ticks: 2
  raw-replay-handshake-timeout-ticks: 1500
  # Main runtime path: after a compatible 51/52 handshake, replay a
  # worker/Freesia-derived native cache bundle from
  # captures/native-cache/<auto-native-cache-capture>. This is what makes the
  # YSM client progress bar and server model picker appear.
  auto-native-cache-on-handshake: true
  auto-native-cache-capture: "freesia-from-velocity"
  auto-native-cache-delay-ticks: 20
  # Native type5 send speed. OPs can change this online with
  # /ysm config speed <intervalTicks> <chunkBytes>.
  auto-native-cache-interval-ticks: 1
  auto-native-cache-chunk-bytes: 59926
  # Research path: Java-generated cache from local .ysm files. Keep disabled
  # for normal use; this is still useful when continuing the ysm-core
  # reimplementation later.
  auto-generated-cache-on-handshake: false
  auto-generated-cache-model: "all"
  auto-generated-cache-delay-ticks: 20
  auto-generated-cache-interval-ticks: 1
  auto-generated-cache-chunk-bytes: 24576
  # legacy keeps the current type3 body that reaches type4/type5 on test
  # clients. keys sends ServerCacheKey/ClientCacheKey in type3 and encrypts
  # type5 cache bodies with ServerCacheKey for protocol experiments.
  auto-generated-cache-layout: "legacy"
  # washed-zstd is the earlier experimental payload and is known to reach
  # type5 but not register as a GUI model. headerless-v3/encrypted-v3 test the
  # technical-report observation that server cache plaintext is closer to a
  # headerless encrypted YSM model than to decompressed resource payloads.
  auto-generated-cache-payload: "washed-zstd"
  # Blank keeps stable cache tokens. Set a unique value on a controlled test
  # client to force a fresh generated cache request/progress cycle.
  auto-generated-cache-token-salt: ""
  # Experimental native/raw sync probe. When enabled, PaperYSM sends one
  # generated S2C id=1 type=1 bootstrap packet after handshake so we can see
  # whether the client answers with C2S id=2. Keep disabled on normal servers
  # until the type=3/model cache stream is complete.
  experimental-bootstrap-on-handshake: false
  # zero matches the most likely blank initial transport key; sequence is a
  # deterministic fallback for reverse-engineering comparisons.
  experimental-bootstrap-mode: "zero"
  experimental-probe-interval-ticks: 8

# Capture C2S id=2 raw/native packets from YSM clients. These captures are used
# to finish the no-worker model distribution protocol.
capture:
  client-raw-packets: true
  raw-packet-dir: "captures/raw"

native:
  # Future no-worker path. When enabled, this will load our reimplementation of
  # the ysm-core server-side packet/cache routines instead of using Freesia's
  # Fabric Worker relay.
  enabled: false
  mode: "java"
